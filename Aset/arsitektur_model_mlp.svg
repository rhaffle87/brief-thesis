<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4a5568" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="1060" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ARSITEKTUR MULTILAYER PERCEPTRON (MLP) KOMPAK UNTUK NIDS TERDISTRIBUSI</text>
  <text x="560" y="63" text-anchor="middle" font-size="12" fill="#64748b">Kapasitas: 6.211 Parameter Bobot &amp; Bias (~24,8 KB) | Masukan: 62 Fitur Numerik Bersih | Keluaran: 3 Logits Kelas</text>

  <!-- 1. Input Layer Block -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="210" height="250" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 202 0 Q 210 0 210 8 L 210 32 L 0 32 Z" fill="#e0f2fe"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#0369a1">1. Lapisan Masukan (Input)</text>
    
    <rect x="15" y="45" width="180" height="190" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="25" y="68" font-size="13" font-weight="700" fill="#0284c7">Vektor Aliran Bersih</text>
    <text x="25" y="86" font-size="11" font-weight="600" fill="#0f172a">Dimensi: 62 Fitur</text>
    
    <text x="25" y="112" font-size="10" fill="#475569">• 5 Waktu &amp; Durasi</text>
    <text x="25" y="128" font-size="10" fill="#475569">• 10 Inter-Arrival Time (IAT)</text>
    <text x="25" y="144" font-size="10" fill="#475569">• 8 Paket Maju (Fwd)</text>
    <text x="25" y="160" font-size="10" fill="#475569">• 7 Paket Balik (Bwd)</text>
    <text x="25" y="176" font-size="10" fill="#475569">• 4 Kecepatan Transfer</text>
    <text x="25" y="192" font-size="10" fill="#475569">• 7 Statistik Ukuran Paket</text>
    <text x="25" y="208" font-size="10" fill="#475569">• 7 Bendera TCP &amp; 7 Jendela</text>
    <text x="25" y="224" font-size="9.5" font-style="italic" fill="#0284c7">Bebas Port (Anti-Shortcut)</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 240 220 L 295 220" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="268" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">x ∈ ℝ⁶²</text>

  <!-- 2. Hidden Layer 1 Block -->
  <g transform="translate(305, 95)" filter="url(#shadow)">
    <rect width="230" height="250" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 222 0 Q 230 0 230 8 L 230 32 L 0 32 Z" fill="#dcfce7"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#15803d">2. Lapisan Tersembunyi 1</text>

    <!-- Linear 1 Box -->
    <rect x="15" y="45" width="200" height="110" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="68" font-size="13" font-weight="700" fill="#16a34a">Linear(62, 64)</text>
    <text x="25" y="86" font-size="11" fill="#334155">Matriks Bobot W₁: 62 × 64 = 3.968</text>
    <text x="25" y="103" font-size="11" fill="#334155">Vektor Bias b₁: 64</text>
    <line x1="25" y1="112" x2="205" y2="112" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="130" font-size="11" font-weight="700" fill="#15803d">Subtotal: 4.096 Parameter</text>
    <text x="25" y="145" font-size="10" fill="#64748b">Beban Memori: ~16,4 KB</text>

    <!-- Down arrow inside box -->
    <path d="M 115 155 L 115 170" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- ReLU 1 Box -->
    <rect x="15" y="175" width="200" height="60" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="115" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Fungsi Aktivasi ReLU</text>
    <text x="115" y="216" text-anchor="middle" font-size="11" fill="#15803d">f(z) = max(0, z)  |  Dim: 64</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 535 220 L 585 220" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">h₁ ∈ ℝ⁶⁴</text>

  <!-- 3. Hidden Layer 2 Block -->
  <g transform="translate(595, 95)" filter="url(#shadow)">
    <rect width="230" height="250" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 222 0 Q 230 0 230 8 L 230 32 L 0 32 Z" fill="#fef3c7"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#b45309">3. Lapisan Tersembunyi 2</text>

    <!-- Linear 2 Box -->
    <rect x="15" y="45" width="200" height="110" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="25" y="68" font-size="13" font-weight="700" fill="#d97706">Linear(64, 32)</text>
    <text x="25" y="86" font-size="11" fill="#334155">Matriks Bobot W₂: 64 × 32 = 2.048</text>
    <text x="25" y="103" font-size="11" fill="#334155">Vektor Bias b₂: 32</text>
    <line x1="25" y1="112" x2="205" y2="112" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="130" font-size="11" font-weight="700" fill="#b45309">Subtotal: 2.080 Parameter</text>
    <text x="25" y="145" font-size="10" fill="#64748b">Beban Memori: ~8,3 KB</text>

    <!-- Down arrow inside box -->
    <path d="M 115 155 L 115 170" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- ReLU 2 Box -->
    <rect x="15" y="175" width="200" height="60" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="115" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Fungsi Aktivasi ReLU</text>
    <text x="115" y="216" text-anchor="middle" font-size="11" fill="#b45309">f(z) = max(0, z)  |  Dim: 32</text>
  </g>

  <!-- Connector 3 -->
  <path d="M 825 220 L 870 220" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="848" y="210" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">h₂ ∈ ℝ³²</text>

  <!-- 4. Output Layer Block -->
  <g transform="translate(880, 95)" filter="url(#shadow)">
    <rect width="210" height="250" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 202 0 Q 210 0 210 8 L 210 32 L 0 32 Z" fill="#f3e8ff"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#7e22ce">4. Lapisan Keluaran (Output)</text>

    <!-- Linear 3 Box -->
    <rect x="15" y="45" width="180" height="95" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="25" y="68" font-size="13" font-weight="700" fill="#9333ea">Linear(32, 3)</text>
    <text x="25" y="86" font-size="11" fill="#334155">Bobot W₃: 32 × 3 = 96</text>
    <text x="25" y="103" font-size="11" fill="#334155">Bias b₃: 3</text>
    <line x1="25" y1="110" x2="185" y2="110" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="126" font-size="11" font-weight="700" fill="#7e22ce">Subtotal: 99 Param</text>

    <!-- Logits Box -->
    <rect x="15" y="150" width="180" height="85" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="25" y="172" font-size="12" font-weight="700" fill="#6b21a8">Logits 3 Kelas</text>
    <text x="25" y="190" font-size="10.5" fill="#3b0764">• 0: BENIGN (Normal)</text>
    <text x="25" y="206" font-size="10.5" fill="#3b0764">• 1: SSH-Patator</text>
    <text x="25" y="222" font-size="10.5" fill="#3b0764">• 2: DoS (Denial of Service)</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(30, 365)" filter="url(#shadow)">
    <rect width="1060" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="25" font-size="12" font-weight="700" fill="#0f172a">REKAPITULASI KOMPUTASI DAN SPESIFIKASI ARSITEKTUR MODEL:</text>
    <text x="20" y="45" font-size="11" fill="#334155">• <tspan font-weight="600">Total Parameter:</tspan> 3.968 (Linear 1) + 64 (Bias 1) + 2.080 (Linear 2) + 99 (Linear 3) = <tspan font-weight="700" fill="#0f172a">6.211 Bobot dan Bias Terlatih</tspan>.</text>
    <text x="20" y="63" font-size="11" fill="#334155">• <tspan font-weight="600">Ukuran Memori Model Biner:</tspan> 6.211 × 4 bita (float32) ≈ 24,8 KB (sangat ringkas untuk pertukaran parameter Flower FL pada perangkat edge).</text>
    <text x="20" y="81" font-size="11" fill="#334155">• <tspan font-weight="600">Fungsi Kerugian &amp; Regularisasi:</tspan> Weighted Cross-Entropy Loss (penanganan ketimpangan kelas 414:1) + Penalti EWC Kuadratik (λ · FIM · Δθ²).</text>
  </g>
</svg>
